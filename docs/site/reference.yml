# The command reference for stata.framework.pub, written by hand.
# scripts/build_docs.py turns it into reference.json (docs-reference.v1)
# with the package version from ado/fw_core.mata. Keep it in step with the
# .sthlp help files.

categories:
  - id: workflow
    title: Workflow
    description: Session initialization, project discovery, and package management
    position: 1
    common: [fw_scaffold, fw_project, fw_setup, fw_packages]
  - id: data
    title: Data
    description: Cataloged datasets and SHA-256 integrity checks
    position: 2
    common: [fw_use, fw_save]
  - id: outputs
    title: Outputs
    description: Recorded tables and exported figures
    position: 3
    common: [fw_table, fw_graph]
  - id: publishing
    title: Publishing
    description: File, bundle, estimation, and code snippet artifacts
    position: 4
    common: [fw_publish, fw_snippet]
  - id: cloud
    title: Cloud
    description: Framework Cloud authentication
    position: 5
    common: [fw_login]

entries:
  - id: fw_setup
    name: fw_setup
    kind: command
    category: workflow
    summary: Check Stata, system tools, backends, and the Cloud connection
    usage: fw_setup [, nopython nonetwork url(string)]
    description: |
      `fw_setup` inspects the Stata environment and prints setup steps for missing dependencies:

      - Stata version and installed package path
      - Active project at or above the current working directory
      - `curl`, SHA-256 utility, and operating system keyring
      - Framework Cloud server URL, workstation login status, and any distinct project server URL
      - `fw` CLI path and version
      - Stata's configured Python interpreter and `framework-py` installation
      - Active backend setting

      When `framework-py` is absent from Stata's Python, `fw_setup` prints the `pip` command for that interpreter.
    parameters:
      - name: nopython
        description: Skips the Python check. Probing Python initializes Stata's Python environment for the session and prevents subsequent `python set exec` changes.
      - name: nonetwork
        description: Skips the live server request that verifies the Cloud token.
      - name: url(string)
        description: Checks a specific Framework Cloud server URL instead of the configured default.
    returns: |
      `r(steps)`: count of recommended setup steps printed.
    examples:
      - code: fw_setup
      - title: Skip Python initialization and network requests
        code: fw_setup, nopython nonetwork
    see_also: [fw_set, fw_login, "guide:installation"]

  - id: fw_project
    name: fw_project
    kind: command
    category: workflow
    summary: Find the project and set path globals
    usage: fw_project [, root(folder) quietly]
    description: |
      `fw_project` searches upward from the current working directory (up to 10 parent levels) for the first directory containing `.framework/`, `settings.yml`, `config.yml`, or `settings.do`. It loads project settings and sets one global macro per configured directory.

      | Global | Value |
      |---|---|
      | `$fw_root` | Project root directory |
      | `$fw_`*key* | Configured path in `directories`, such as `$fw_inputs_raw` |
      | `$fw_data` | `directories.data`, else `inputs_final`, else `inputs_public_final` when configured |
      | `$fw_outputs` | `outputs` directory when present |
      | `$fw_project_name` | `project_name`, else `project.name`, else `name`, else the root folder name |
    details: |
      Paths are absolute and normalized with forward slashes on all platforms. Loading a project clears `$fw_*` globals from any prior project.

      Settings load from `settings.yml`, merging split YAML files such as `settings/data.yml` and active environment overrides (`FW_CONFIG_ACTIVE`, else `R_CONFIG_ACTIVE`, else `R_CONFIG_NAME`, else `default`). Projects created with `fw` for Stata also define directory globals in `settings.do`. `fw_project` reads `settings.yml` first, appends any `settings.do` directories absent from `settings.yml`, and leaves plain `settings.do` globals such as `$inputs_raw` unchanged.

      When both files define different paths for the same directory key, `settings.yml` takes precedence and `fw_project` prints a notice.

      Other Framework commands invoke `fw_project` automatically when no project is loaded. Run `fw_project` or `fw_scaffold` again after switching projects.
    parameters:
      - name: root(folder)
        description: Starts project discovery from *folder* instead of the current working directory.
      - name: quietly
        description: Suppresses the project summary output.
    returns: |
      - `r(root)`: project root directory
      - `r(name)`: project name
      - `r(folders)`: space-separated directory keys
      - `r(conflicts)`: directory keys where `settings.yml` and `settings.do` differed
    examples:
      - code: |
          fw_project
          use "$fw_inputs_raw/survey.dta", clear
        runnable: false
    see_also: [fw_scaffold, fw_use, "guide:projects"]

  - id: fw_scaffold
    name: fw_scaffold
    kind: command
    category: workflow
    summary: Load the project and initialize the Stata session
    usage: fw_scaffold [, root(folder) noinstall quietly]
    description: |
      `fw_scaffold` initializes the Stata session from project settings, matching `scaffold()` in R and Python. Place it at the top of `master.do` or individual scripts. In order, it:

      1. Loads the project and sets directory globals via `fw_project`.
      2. Sets Stata's `PLUS` directory to `ado/plus` inside the project when `packages.project_ado` is `true`. Framework's own folders in the previous `PLUS` directory move to the end of the ado-path, so framework commands still load and the project's packages come first.
      3. Installs missing project packages via `fw_packages`.
      4. Sets the random number seed.
      5. Sets the graph scheme.
      6. Prepends configured function directories to the ado-path so `.ado` programs load by name.
      7. Runs `scaffold.do` in the project root when present.
    details: |
      Session options read the `scaffold` section of `settings.yml`:

      | Setting | Effect |
      |---|---|
      | `seed_on_scaffold` | Enables random seeding. When omitted, setting `FW_SEED` in the environment enables seeding; `false` disables seeding even when `FW_SEED` is set. |
      | `seed` | Integer seed value. Falls back to `FW_SEED`, then `123`. |
      | `set_theme_on_scaffold` | Applies the graph scheme configured in `stata_scheme`. |
      | `source_all_functions` | Adds `directories.functions` (default `functions`) to the ado-path unless set to `false`. |

      Programs placed in the functions directory (such as `functions/clean_ids.ado`) are callable across all project scripts. Run `discard` after editing an `.ado` file to reload its definition.
    parameters:
      - name: root(folder)
        description: Starts project discovery in *folder*.
      - name: noinstall
        description: Skips installing missing packages.
      - name: quietly
        description: Suppresses informational output while preserving errors and `scaffold.do` output.
    returns: |
      - `r(root)`: project root directory
      - `r(seed)`: applied seed value, or empty
      - `r(scheme)`: applied graph scheme, or empty
      - `r(plus)`: project `PLUS` directory when `project_ado` is enabled
      - `r(functions)`: directories added to the ado-path
    examples:
      - code: fw_scaffold
        runnable: false
    see_also: [fw_project, fw_packages, "guide:packages"]

  - id: fw_packages
    name: fw_packages
    kind: command
    category: workflow
    summary: List and install project packages
    usage: fw_packages [list|install|update] [names] [, quietly]
    description: |
      `fw_packages` inspects the `packages` section of `settings.yml` or `settings/packages.yml` and reports installation status. `fw_packages install` installs missing packages. `fw_packages update` reinstalls configured packages. Optional *names* restrict the operation to specific packages.

      | Source | Installer |
      |---|---|
      | `ssc` | `ssc install` *name* (default source) |
      | `github` | `net install` from `repo` at optional `ref` |
      | `net` | `net install` from the directory or URL in `url` |
    details: |
      String entries use shorthand syntax: `- estout` selects SSC, and `- sergiocorreia/reghdfe@6.12.3` selects GitHub at tag `6.12.3`. Entries with `cran`, `bioc`, or `pypi` sources belong to R or Python and are listed as skipped.

      When `project_ado: true` is set, packages install into `ado/plus` inside the project directory. Commit `ado/plus` to keep exact package versions with the repository. When `project_ado` is off, packages install into Stata's shared `PLUS` directory.

      If an installation fails, `fw_packages` finishes attempting remaining packages before exiting with the first error code.
    parameters:
      - name: quietly
        description: Suppresses status summaries while preserving `ssc` and `net` output.
    returns: |
      - `r(packages)`: all configured Stata package names
      - `r(installed)`: installed packages
      - `r(missing)`: uninstalled packages
      - `r(skipped)`: non-Stata or invalid package entries
      - `r(failed)`: packages whose installation failed
      - `r(plus)`: target `PLUS` directory inspected or updated
    examples:
      - code: |
          fw_packages
          fw_packages install
        runnable: false
    see_also: [fw_scaffold, fw_project, "guide:packages"]

  - id: fw_use
    name: fw_use
    kind: command
    category: data
    summary: Load a named dataset and verify its integrity
    usage: fw_use name [, clear check(strict|warn|off|accept) na(strings) asfloat options(string)]
    description: |
      `fw_use` loads a dataset resolved in three steps:

      1. **File path** (containing a slash or file extension, such as `inputs/raw/survey.csv`), checked relative to the current directory first and then the project root.
      2. **Data catalog key** under `data` in `settings.yml` or `settings/data.yml`, such as `inputs.raw.survey`.
      3. **Dot notation**, where the longest prefix matching a configured directory selects the folder and the remainder names a `.dta` file (`inputs.final.analysis` resolves to `$fw_inputs_final/analysis.dta`).

      File extensions select the Stata reader: `.dta` calls `use`, `.csv` and `.tsv` call `import delimited`, and `.xlsx` and `.xls` call `import excel, firstrow`.

      Delimited files follow R's `data_read()` conventions: empty cells and `NA` import as missing values, columns containing numbers and `NA` become numeric, and decimal columns import as `double`. Renamed columns (such as headers over 32 characters) are reported in the output, and `stata_names` in the catalog maps long headers to chosen variable names.
    details: |
      Before loading a named dataset, `fw_use` verifies the file's SHA-256 checksum against `.framework/stata-integrity.tsv`. After loading, it verifies Stata's `datasignature`. Modified locked datasets stop with error 459; modified unlocked datasets warn and update the stored record. Pass `check(accept)` to record an intentional update to a locked dataset without rewriting the file.

      Because `.dta` files embed a save timestamp, resaving identical data with plain `save` alters the file SHA-256 hash and triggers error 459 on locked datasets. Save updates with `fw_save` or accept external updates with `check(accept)`.

      First-time reads of an unrecorded name create an unlocked integrity entry unless the catalog sets `locked: true`. Plain file paths skip integrity checks, matching R's `data_read()`.

      SHA-256 hashes use `sha256sum` or `shasum` on Linux and macOS and PowerShell on Windows. When no SHA-256 tool is present, Stata verifies `datasignature` alone.
    parameters:
      - name: name
        required: true
        description: File path, catalog key, or dot-notation dataset name.
      - name: clear
        description: Replaces existing data in memory.
      - name: check(strict|warn|off|accept)
        default: strict
        description: Integrity verification mode. `warn` loads a modified locked dataset with a warning while keeping the previous checksum. `off` skips verification and recording. `accept` loads a catalog or dot-named dataset, updates the recorded SHA-256 hash and `datasignature` without rewriting the file, preserves lock state, and updates the live Cloud ledger when enabled.
      - name: na(strings)
        default: '"NA"'
        description: Missing-value tokens for CSV and TSV files (in addition to empty cells). Numeric tokens such as `na("NA" "-99")` apply to numeric columns as well. Pass `na("")` to keep literal `"NA"` strings.
      - name: asfloat
        description: Imports CSV and TSV decimals as `float` instead of `double`.
      - name: options(string)
        description: Native options forwarded to `use`, `import delimited`, or `import excel`.
    returns: |
      - `r(name)`: resolved dataset identifier
      - `r(path)`: file path
      - `r(type)`: `dta`, `csv`, `tsv`, `xlsx`, or `xls`
      - `r(sha256)`: file SHA-256 checksum when available
      - `r(datasignature)`: Stata data signature
      - `r(locked)`: `1` when locked, `0` otherwise
      - `r(accepted)`: `1` when `check(accept)` updated the stored fingerprint
      - `r(renamed)`: count of columns renamed during import
      - `r(na_columns)`: count of columns where `na()` tokens converted to missing
    examples:
      - code: fw_use inputs.raw.survey, clear
        runnable: false
      - title: Load a CSV file by path
        code: fw_use "inputs/raw/visits.csv", clear options(varnames(1))
        runnable: false
      - title: Accept an updated locked dataset
        code: fw_use inputs.raw.survey, clear check(accept)
        runnable: false
    see_also: [fw_save, "guide:data"]

  - id: fw_save
    name: fw_save
    kind: command
    category: data
    summary: Save a named dataset and record its integrity
    usage: fw_save name [, replace lock unlock outside options(string)]
    description: |
      `fw_save` writes the dataset in memory and records its SHA-256 checksum and Stata `datasignature` in `.framework/stata-integrity.tsv`. Names resolve with the same rules as `fw_use`. For example, `fw_save inputs.final.analysis` writes `$fw_inputs_final/analysis.dta` and creates missing parent directories. Relative file paths resolve against the current directory when the file or parent folder exists there, and otherwise against the project root.
    details: |
      When `options: cloud_ledger: live` is enabled in `settings.yml` (and `FW_LEDGER` is not `off`), `fw_save` sends the dataset name, SHA-256 hash, byte size, and computer hostname to Framework Cloud using `FW_PROJECT_TOKEN`. Observation data is never uploaded.

      `fw_save` does not modify `settings.yml`. Plain file paths such as `outputs/tables/summary.csv` are recorded under their project-relative path (`r(record)`), matching R's `data_save()`.

      Saved datasets are unlocked unless `lock` is passed, matching `data_save()` in R and Python.

      `fw_save` does not change locked data (error 608), matching `data_save()` in R and Python. Locked data is a catalog entry marked `locked: true`, referenced by catalog key or file path, or a dataset `fw_save` saved with `lock`. Saving the same data again works and keeps the lock: the data's `datasignature` matches the integrity record, and the file still matches the record's SHA-256. New data stops before the file is written. Write derived data under a separate name, or pass `unlock` to replace locked data. Setting `locked: false` on a catalog entry also unlocks it. Paths resolving outside the project root also stop unless `outside` is passed.
    parameters:
      - name: name
        required: true
        description: File path, catalog key, or dot-notation dataset name.
      - name: replace
        description: Overwrites an existing output file.
      - name: lock
        description: Records the dataset as locked, so future changes error rather than warn on `fw_use`, and later saves of new data need `unlock`.
      - name: unlock
        description: Replaces locked data. The new file is unlocked unless `lock` is also passed.
      - name: outside
        description: Permits writing outside the project root directory. Locked data still needs `unlock`.
      - name: options(string)
        description: Native options forwarded to `save`, `export delimited`, or `export excel`.
    returns: |
      `r(name)`, `r(path)`, `r(type)`, `r(sha256)`, `r(datasignature)`, and `r(locked)` as in `fw_use`, plus `r(record)` containing the recorded dataset key or project-relative path.
    examples:
      - code: |
          sysuse auto, clear
          fw_save inputs.raw.cars, replace
        runnable: false
      - title: Save a locked dataset
        code: fw_save inputs.final.analysis, replace lock
        runnable: false
      - title: Replace locked data on purpose
        code: fw_save inputs.raw.cars, replace unlock
        runnable: false
    see_also: [fw_use, "guide:data"]

  - id: fw_table
    name: fw_table
    kind: command
    category: outputs
    summary: Save data in memory or a matrix as a table
    usage: fw_table name [varlist] [if] [in] [, matrix(matname) headers(strings) varnames format(csv xlsx) public nolabel na(string) noreplace]
    description: |
      `fw_table` exports the dataset in memory or a Stata matrix to the project's tables directory, matching `save_table()` in R and Python. Column headers default to variable labels (falling back to variable names) or explicit strings supplied in `headers()`, such as `"All patients, n (%)"`. Data in memory remain unmodified.

      *name* specifies the output stem without extension and may include subdirectories such as `meeting/table-1`, which `fw_table` creates automatically. Appending `.csv` or `.xlsx` to *name* selects that output format.
    details: |
      Output files write to `directories.outputs_tables` (or `outputs/tables`). In privacy-sensitive projects (`security.sensitive: true` or split `outputs_private_tables` / `outputs_public_tables` directories), tables write to the private directory unless `public` is specified. Exporting a `public` table from data loaded out of a path containing `private` prints a warning.

      Every exported file is logged in `.framework/stata-results.tsv` with its project-relative path, output type, public flag, SHA-256 hash, byte size, and timestamps.

      CSV formatting matches R's `write_csv()`: missing numbers serialize as `NA`, floats use minimal exact decimal digits, value labels export as text unless `nolabel` is set, dates use ISO `YYYY-MM-DD`, and fields quote only when required. Excel files export via `export excel` (80-character header limit).

      Matrix exports use column names as headers; custom row names other than default `r1`, `r2`, ... export in a leading column with an empty header.
    parameters:
      - name: name
        required: true
        description: Output file stem (with optional subdirectories).
      - name: matrix(matname)
        description: Exports a Stata matrix instead of the dataset in memory.
      - name: headers(strings)
        description: Ordered column headers. Enclose multi-word headers in double quotes.
      - name: varnames
        description: Uses Stata variable names as headers instead of variable labels.
      - name: format(csv xlsx)
        default: csv
        description: Output file formats. Specify `format(csv xlsx)` to write both.
      - name: public
        description: Writes to the public tables directory in projects with private/public output separation.
      - name: nolabel
        description: Exports underlying numeric codes instead of value labels.
      - name: na(string)
        default: NA
        description: Missing-value token for numeric columns in CSV output.
      - name: noreplace
        description: Stops with error 602 if the target file exists instead of overwriting it.
    returns: |
      - `r(path)`: first exported file path
      - `r(paths)`: space-separated list of exported file paths
      - `r(sha256)`: first file's SHA-256 checksum
      - `r(format)`: exported formats
      - `r(public)`: `1` when `public` was specified
      - `r(N)`, `r(k)`: exported row and column counts
    examples:
      - code: |
          sysuse auto, clear
          label variable price "Price, US$"
          fw_table cars make price mpg
        runnable: false
      - title: Custom headers, subdirectory, and dual CSV/Excel output
        code: fw_table "meeting/table-1" group n pct, headers("Group" "Patients" "Share, %") format(csv xlsx)
        runnable: false
      - title: Export a Stata matrix
        code: |
          tabstat price mpg, by(foreign) save
          matrix S = r(StatTotal)
          fw_table totals, matrix(S) public
        runnable: false
    see_also: [fw_graph, fw_publish]

  - id: fw_graph
    name: fw_graph
    kind: command
    category: outputs
    summary: Export a graph to the figures folder and record its checksum
    usage: fw_graph name [, name(graphname) format(types) public dpi(#) width(#) height(#) options(string) noreplace]
    description: |
      `fw_graph` exports a Stata graph to the project's figures directory via `graph export` and records each file's SHA-256 checksum, matching `save_figure()` in R and Python.

      *name* specifies the file stem without extension and may include subdirectories such as `meeting/figure-1`. Appending an extension such as `figure-1.pdf` selects that format.
    details: |
      Output files write to `directories.outputs_figures` (or `outputs/figures`). Privacy-sensitive projects route figures to the private figures directory unless `public` is passed.

      Exported files are logged in `.framework/stata-results.tsv` alongside tables from `fw_table`.

      Supported formats match `graph export`: `png`, `pdf`, `svg`, `eps`, `ps`, `tif`, `jpg`, `gif`, `emf`, and `wmf` (`gif` is unavailable on Unix Stata, and `emf`/`wmf` require Windows).
    parameters:
      - name: name
        required: true
        description: Output file stem (with optional subdirectories).
      - name: name(graphname)
        description: Selects a named graph in memory, displaying it first so batch sessions without a GUI window can export it.
      - name: format(types)
        default: png
        description: One or more output extensions, such as `format(png pdf)`.
      - name: public
        description: Writes to the public figures directory in projects with private/public output separation.
      - name: dpi(#)
        default: "300"
        description: Raster resolution in pixels per inch (multiplied by the graph's width in inches).
      - name: width(#), height(#)
        description: Explicit raster dimensions in pixels, overriding `dpi()`.
      - name: options(string)
        description: Additional options forwarded to `graph export`.
      - name: noreplace
        description: Stops with error 602 if the target file exists instead of overwriting it.
    returns: |
      - `r(path)`: first exported file path
      - `r(paths)`: all exported file paths
      - `r(sha256)`: first file's SHA-256 checksum
      - `r(format)`: exported formats
      - `r(public)`: `1` when `public` was specified
    examples:
      - code: |
          scatter mpg price
          fw_graph price-mpg
        runnable: false
      - title: Export PNG and PDF to a public subdirectory
        code: fw_graph "meeting/figure-1", format(png pdf) public
        runnable: false
    see_also: [fw_table, fw_publish]

  - id: fw_publish
    name: fw_publish
    kind: command
    category: publishing
    summary: Publish a figure, table, document, bundle, or estimation model
    usage: |
      fw_publish filename [, options]
      fw_publish folder | folder/pattern [, options]
      fw_publish, estimates [options level(#) saving(filename [, replace])]
    description: |
      `fw_publish` publishes a file, directory bundle, or estimation model as a versioned artifact. Each publish adds a new version while retaining earlier versions.

      Passing a directory bundles every file inside that directory and its subdirectories as one artifact, matching `publish_dir()` in R and Python. Passing a wildcard such as `outputs/figures/*.png` bundles matching top-level files in that directory, generating an `index.html` listing when absent.

      Passing `estimates` serializes Stata's active estimation results into a structured model artifact containing coefficients, standard errors, test statistics, p-values, confidence intervals, and fit statistics.
    sections:
      - title: Destinations
        content: |
          When `to()` is omitted, `fw_publish` uses `publish.default` from `settings.yml`, defaulting to Framework Cloud. Named destinations are configured under `publish.destinations`. Because folder destinations require a target directory, bare `to(folder)` raises an error.

          Stata handles `folder` and `cloud` destinations natively. GitHub Pages (`github`) and S3 (`s3`) use the `fw` CLI or `framework-py` backend; see `fw_set`. Cloud uploads authenticate with `FW_PROJECT_TOKEN` in `.env`. The server is `FW_CLOUD_URL` in `.env`, then the environment, then the saved login. A `.env` with a token but no `FW_CLOUD_URL` stops with an error.
      - title: Estimation commands
        content: |
          `regress`, `logit`, `logistic`, `probit`, `poisson`, `nbreg`, `glm`, `mixed`, `stcox`, and `ivregress` map to typed Framework models with appropriate family, link, and ratio transformations. Other commands exposing `e(b)` and `e(V)` publish a generic coefficient table.

          Coefficients remain on the linear predictor scale, `_cons` maps to `(Intercept)`, and base or omitted factor levels are excluded. `mixed` includes random-effects variance and correlation tables (`independent`, `identity`, `exchangeable`, and `unstructured`). `nbreg` records `alpha` or `delta` in fit statistics, while auxiliary free parameters such as `tobit` variances and `ologit` cutpoints appear in an ancillary parameter table.
      - title: Private paths
        content: |
          Any input path containing `private` (case-insensitive) requires confirmation. Interactive sessions prompt; batch sessions stop with error 198 unless `includeprivate` is passed. Note that `private` sets `visibility(private)` rather than confirming private file paths.

          With `estimates`, Stata checks the source path of the dataset in memory (from the most recent `fw_use`, `fw_save`, or `c(filename)`) against the same rule.
    parameters:
      - name: filename
        description: File, directory, or wildcard pattern to publish. Omit when passing `estimates`.
      - name: estimates
        description: Publishes active estimation results as a structured model artifact.
      - name: slug(string)
        description: URL slug for the artifact (defaults to the file or directory stem).
      - name: title(string)
        description: Reader-facing display title.
      - name: description(string)
        description: Short artifact summary.
      - name: to(destination)
        description: "`cloud`, `github`, `s3`, or a named destination in `settings.yml`."
      - name: visibility(string)
        description: "`public`, `unlisted`, or `private`. New Cloud artifacts default to `unlisted`; subsequent publishes without `visibility()` keep existing visibility."
      - name: private
        description: Shorthand for `visibility(private)`.
      - name: includeprivate
        description: Confirms publishing files or estimation datasets from paths containing `private`.
      - name: kind(string)
        description: Overrides inferred artifact kind (`image`, `html`, `file`, `code_snippet`, or `dag`).
      - name: display(settings)
        description: "What Framework Cloud embeds show, as `key=on` or `key=off` separated by spaces, such as `display(legend=off analysis=off)`. Keys: `title`, `description`, `author`, `details`, `variable_tips`, `column_summaries`, `output`, `links`, `legend`, `analysis`, `dagitty`, `code`, `interactive`. Only named keys change. The `fw` backend needs fw 0.8.3 or newer."
      - name: level(#)
        default: c(level)
        description: Confidence level for `estimates` (defaults to `c(level)`, typically 95). Estimation command display flags are not inherited automatically.
      - name: saving(filename [, replace])
        description: Writes a local copy of `model.json` when publishing `estimates`.
    returns: |
      - `r(url)`: published reader URL when supported
      - `r(location)`: output directory for `folder` destinations
      - `r(version)`: published version number
      - `r(version_url)`: version-specific URL
      - `r(embed_link)`: the link to paste into a site that takes Framework embeds, when Cloud gives one
      - `r(unchanged)`: `1` when Cloud kept the latest version of an unchanged code snippet, else `0`
      - `r(destination)`: destination name
      - `r(driver)`: `cloud`, `folder`, `github`, or `s3`
      - `r(backend)`: `core`, `cli`, or `python`
      - `r(slug)`: stored artifact slug
      - `r(file)`: published path, or `saving()` path for `estimates`
      - `r(files)`: number of bundled files

      Every backend sets this schema; fields unsupported by a driver or backend return empty.
    examples:
      - title: Publish a figure
        code: |
          graph export "$fw_outputs_figures/price.png", replace
          fw_publish "$fw_outputs_figures/price.png", title("Price and mileage")
        runnable: false
      - title: Publish estimation results to a named destination
        code: |
          sysuse auto, clear
          regress price mpg weight
          fw_publish, estimates slug(price-model) to(lab)
        runnable: false
    see_also: [fw_set, "guide:publishing", "guide:estimates"]

  - id: fw_snippet
    name: fw_snippet
    kind: command
    category: publishing
    summary: Publish commands and the output they printed as a code snippet
    usage: |
      fw_snippet begin label
      fw_snippet end [, options]
    description: |
      `fw_snippet` publishes a `code_snippet` artifact: the commands run between `fw_snippet begin` and `fw_snippet end`, and the text Stata printed under them. Blog posts and reports embed snippets beside the results they produced.

      `fw_snippet begin` opens an SMCL log named `fw_snippet` alongside any user log. `fw_snippet end` closes it, splits it at Stata's command echo, and publishes the result through `fw_publish`. Each command becomes a code block without its `.` prompt, with `///` continuation lines kept. The SMCL between commands becomes an output block, sent unchanged. Framework Cloud renders the SMCL with Stata's column layout, box characters, and result styles, and marks output that starts with an `{err}` message as an error. Commands that print nothing share a code block with the next command. The `fw_snippet end` line is excluded.
    details: |
      The snippet records `source.file` (the do-file, relative to the project root), `source.lines` (the lines between `begin` and `end`), and `source.commit` (git `HEAD` of the project). Stata does not expose the running do-file, so `fw_snippet end` searches the project's do-files for `fw_snippet begin` *label*. When several do-files match, the file is omitted; `file()` names it. `source.repository` is sent only when `repository()` or `publish.repository` in `settings.yml` sets it. Cloud builds a GitHub permalink from the repository, commit, file, and lines.

      `snippet.width` is `c(linesize)`. Graphs never enter a snippet. Commands that Stata does not echo, such as those run with `quietly do` or inside a `quietly {` block, are absent from the code.

      An unchanged snippet adds no version on Framework Cloud. The upload returns the current version with `unchanged: true`, and `fw_snippet end` reports "Unchanged, still version *#*".
    sections:
      - title: Errors and recovery
        content: |
          Snippets do not nest: `fw_snippet begin` with a snippet open stops with error 198 and leaves the open snippet recording. When a do-file stopped with an error inside a snippet, the next `fw_snippet begin` closes the stale log. `log close fw_snippet` discards an open snippet.

          `fw_snippet end` validates its options before closing the log, so a mistyped option leaves the snippet open. When publishing fails, the snippet JSON stays in a temporary folder and the error names the `fw_publish` command that retries it.
    parameters:
      - name: label
        required: true
        description: Snippet label, one word such as `fit-ols`. Defaults the slug.
      - name: folded
        description: Folds every output block.
      - name: unfolded
        description: Opens every output block. Without `folded` or `unfolded`, Cloud folds output longer than 12 lines.
      - name: nooutput
        description: Publishes the code blocks only.
      - name: slug(string), title(string), description(string)
        description: As in `fw_publish`. `slug()` defaults to the label.
      - name: to(destination)
        description: "`cloud` or a named destination in `settings.yml`."
      - name: visibility(string)
        description: "`public`, `unlisted`, or `private`. New Cloud snippets default to `unlisted`."
      - name: private
        description: Shorthand for `visibility(private)`.
      - name: notebook(url)
        description: Adds a link to the full notebook (an `https` address).
      - name: model(slug or url)
        description: Adds a link to a model artifact in the same project, or an `https` address. Readers see it only when they may open the model.
      - name: repository(url)
        description: GitHub repository of the do-file, such as `https://github.com/owner/analysis`. Overrides `publish.repository`.
      - name: file(filename)
        description: Do-file that holds the snippet, when the label search finds none or several.
      - name: display(settings)
        description: "What Framework Cloud embeds of the snippet show, such as `display(output=off links=off)`. See `fw_publish`."
      - name: saving(filename [, replace])
        description: Writes a local copy of the snippet JSON.
      - name: nopublish
        description: Skips publishing. Requires `saving()`.
    returns: |
      - `r(url)`, `r(version)`, `r(slug)`, and the other `fw_publish` results
      - `r(unchanged)`: `1` when Cloud kept the latest version, else `0`
      - `r(label)`: snippet label
      - `r(source_file)`: do-file relative to the project root
      - `r(lines)`: do-file line range, such as `12-15`
      - `r(commit)`: git commit
      - `r(file)`: the `saving()` copy
      - `r(blocks)`, `r(code_blocks)`, `r(output_blocks)`: block counts
    examples:
      - title: Publish a regression with its table
        code: |
          sysuse auto, clear
          fw_snippet begin fit-ols
          regress price mpg i.foreign
          fw_snippet end, unfolded visibility(public)
        runnable: false
      - title: Save the snippet without publishing
        code: |
          fw_snippet begin summary
          summarize price mpg weight
          fw_snippet end, nopublish saving(summary.json, replace)
        runnable: false
    see_also: [fw_publish, "guide:snippets", "guide:publishing"]

  - id: fw_login
    name: fw_login
    kind: command
    category: cloud
    summary: Connect this computer to Framework Cloud
    usage: fw_login [, url(string) nobrowser]
    description: |
      `fw_login` authenticates the workstation with Framework Cloud via device approval:

      1. Stata prints a verification code and opens the browser approval page.
      2. Sign in and approve the computer.
      3. Stata saves the issued token in the operating system keyring.

      R, Python, and `fw` share the same keyring entry. When no system keyring is available, Stata stores the token in a mode-restricted file inside the Framework configuration directory. Tokens never appear in Stata's Results window, macros, or log files.
    details: |
      `fw_login` authenticates the workstation. Publishing project artifacts to Cloud uses `FW_PROJECT_TOKEN` in the project's `.env` file.
    parameters:
      - name: url(string)
        description: Connects to a self-hosted Framework Cloud URL instead of `https://framework.pub`.
      - name: nobrowser
        description: Prints the approval URL without launching a browser (always active in batch mode).
    returns: |
      - `r(account)`: connected account name
      - `r(stored)`: credential store used (`keyring` or `file`)
    examples:
      - code: fw_login
        runnable: false
      - title: Connect to a self-hosted server
        code: fw_login, url("https://cloud.example.org")
        runnable: false
    see_also: [fw_logout, fw_setup, "guide:cloud"]

  - id: fw_logout
    name: fw_logout
    kind: command
    category: cloud
    summary: Remove this computer's Framework Cloud token
    usage: fw_logout [, url(string)]
    description: |
      `fw_logout` revokes the workstation token on Framework Cloud and removes it from the system keyring and shared token files read by Python and `fw`. If the server cannot be reached, `fw_logout` deletes local credentials and instructs you to revoke the token under **Account > Computers & API tokens**. Environment tokens in `FW_CLOUD_TOKEN` are left unchanged, and any separate R fallback token file is reported by path.
    parameters:
      - name: url(string)
        description: Server URL to sign out from (defaults to `FW_CLOUD_URL`, else the remembered Cloud server).
    examples:
      - code: fw_logout
        runnable: false
    see_also: [fw_login, "guide:cloud"]

  - id: fw_set
    name: fw_set
    kind: command
    category: workflow
    summary: Configure the publishing backend and fw binary path
    usage: |
      fw_set
      fw_set backend {auto|core|cli|python}
      fw_set fw_path {path|clear}
    description: |
      Running `fw_set` without arguments displays current settings. Preferences persist in `stata.conf` inside the Framework configuration directory across all projects.

      | Backend | Behavior |
      |---|---|
      | `auto` | Native Stata for `folder` and `cloud`; tries `fw`, then `framework-py`, for `github` and `s3` (default) |
      | `core` | Native Stata only; `github` and `s3` raise an error |
      | `cli` | Routes all publishes through `fw` |
      | `python` | Routes all publishes through `framework-py` in Stata's Python (Stata 16 or newer) |
    details: |
      Set `global FW_BACKEND cli` to override the saved backend for a single session.

      Use `fw_set fw_path` when Stata cannot locate `fw` on `PATH` (common in the macOS GUI application, which starts with a minimal system `PATH`).
    parameters:
      - name: backend
        description: "`auto`, `core`, `cli`, or `python`."
        default: auto
        env: FW_BACKEND
      - name: fw_path
        description: Absolute path to the `fw` executable, or `clear` to reset.
    examples:
      - code: |
          fw_set backend cli
          fw_set fw_path "/opt/homebrew/bin/fw"
        runnable: false
    see_also: [fw_publish, fw_setup, "guide:backends"]
